{% set version = "1.0.5" %}

package:
  name: spago
  version: {{ version }}

source:
  url: https://registry.npmjs.org/spago/-/spago-{{ version }}.tgz
  sha256: 8d91fafa73a6ed23b7ab0176f0b5a20416b1ce083848d65b85d2b2650922af36

build:
  number: 0
  skip: true  # [win or ppc64le]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs
  run:
    - nodejs

test:
  commands:
    - spago --help

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - third-party-licenses.txt
  summary: PureScript package manager and build tool
  home: https://github.com/purescript/spago
  dev_url: https://github.com/purescript/spago

extra:
  recipe-maintainers:
    - danielnachun
